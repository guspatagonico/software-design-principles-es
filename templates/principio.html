<!DOCTYPE html>
<html lang="es" data-accent="{{ACCENT}}"{{WIDTH_CLASS}}>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
</head>
<body>
{{SNAV_TOP}}

<header>
	<div class="header-label">{{HEADER_LABEL}}</div>
	<h1>{{HEADER_TITLE}}</h1>
	<p>{{HEADER_SUBTITLE}}</p>
</header>

<div class="nav-wrap">
	<div class="nav" id="nav">
		<div class="nav-pill" id="navPill"></div>
		{{TABS_HTML}}
	</div>
</div>

<main>
	{{PANELS_HTML}}

	<div style="margin-top:36px;padding-top:32px;border-top:1px solid var(--border)">
		{{CONTEXT_HTML}}
	</div>

	<div class="progress" id="progress">
		{{PROGRESS_DOTS}}
	</div>
	<div class="nav-btns">
		<button class="nav-btn" id="btnPrev">← Anterior</button>
		<button class="nav-btn" id="btnNext">Siguiente →</button>
	</div>
</main>

<footer>
	<span>{{FOOTER_LEFT}}</span>
	<span>{{FOOTER_RIGHT}}</span>
</footer>

{{SNAV_BOT}}

<script src="../js/tabs.js"></script>
</body>
</html>
